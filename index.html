<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date - Carl & Emma</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f7f9fa;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .card-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1.44;
            background-image: url('image_ipLfch.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 8px;
        }

        .hearts-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 10;
        }

        .heart {
            position: absolute;
            bottom: -20px;
            font-size: 24px;
            animation: floatUp 6s linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            50% { transform: translateY(-40vh) translateX(25px) rotate(180deg) scale(1.1); }
            90% { opacity: 0.8; }
            100% {
                transform: translateY(-90vh) translateX(-25px) rotate(360deg) scale(0.9);
                opacity: 0;
            }
        }

        .btn-overlay {
            position: absolute;
            cursor: pointer;
            border-radius: 50px;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        #yesBtn {
            bottom: 6.8%;
            left: 28%;
            width: 19%;
            height: 6.5%;
            z-index: 20;
        }

        #noBtn {
            bottom: 6.8%;
            right: 28%;
            width: 19%;
            height: 6.5%;
            z-index: 20;
            transform-origin: center;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0) scale(1); }
            20%, 60% { transform: translateX(-8px) scale(1.1); }
            40%, 80% { transform: translateX(8px) scale(1.1); }
        }

        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="hearts-container" id="heartsLayer"></div>
    <div id="yesBtn" class="btn-overlay" onclick="handleYes()"></div>
    <div id="noBtn" class="btn-overlay" onclick="handleNo()"></div>
</div>

<script>
    const heartsLayer = document.getElementById('heartsLayer');
    const heartColors = ['#ff4d6d', '#ff758f', '#c9184a', '#ffb3c1', '#fae0e4'];
    
    function createHeart() {
        const heart = document.createElement('div');
        heart.innerHTML = '❤️';
        heart.className = 'heart';
        heart.style.left = Math.random() * 80 + 10 + '%'; 
        heart.style.animationDuration = Math.random() * 3 + 4 + 's'; 
        heart.style.fontSize = Math.random() * 15 + 15 + 'px';
        heart.style.color = heartColors[Math.floor(Math.random() * heartColors.length)];
        
        heartsLayer.appendChild(heart);
        setTimeout(() => { heart.remove(); }, 7000);
    }
    
    setInterval(createHeart, 800);

    let noClickCount = 0;
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');

    function triggerYesShake() {
        yesBtn.classList.remove('shake-animation');
        void yesBtn.offsetWidth;
        yesBtn.classList.add('shake-animation');
    }

    function handleYes() {
        alert("Yay! We can't wait to celebrate with you! 🎉🍾");
    }

    function handleNo() {
        noClickCount++;
        if (noClickCount === 1) {
            alert("Are you sure? 🥺");
            noBtn.style.transform = "scale(0.75)";
            triggerYesShake();
        } 
        else if (noClickCount === 2) {
            alert("You'll break their hearts! 💔😭");
            noBtn.style.transform = "scale(0.35)";
            triggerYesShake();
        } 
        else if (noClickCount >= 3) {
            alert("We'll miss you! Your No RSVP has been recorded. 😔");
            noBtn.style.transform = "scale(0.1)";
            noBtn.style.opacity = "0.2";
            noBtn.onclick = null;
        }
    }
</script>

</body>
</html>
